name: Build ShPD 4.0 FunMod APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply FunMod patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(
                      f"Patch target not found in {path}: {old[:120]!r}"
                  )
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # ==========================================================
          # 1. 강화 주문서 총 50장
          # 기본 15회 생성에서 3,3,4 패턴 반복 = 총 50장
          # ==========================================================
          replace_once(
              "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/Level.java",
              "\t\t\t\t\taddItemToSpawn(new ScrollOfUpgrade());",
              """\t\t\t\t\tScrollOfUpgrade funModScroll = new ScrollOfUpgrade();
          \t\t\t\t\tint funModQty =
          \t\t\t\t\t\t\tDungeon.LimitedDrops.UPGRADE_SCROLLS.count % 3 == 0 ? 4 : 3;
          \t\t\t\t\tfunModScroll.quantity(funModQty);
          \t\t\t\t\taddItemToSpawn(funModScroll);"""
          )

          # ==========================================================
          # 2. 일반 던전 몹
